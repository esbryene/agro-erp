services:
  - type: web
    name: agro-erp-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node src/migrate.js && node src/seed.js && node src/index.js
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: anexos
      # Login do primeiro administrador. Defina os dois no painel do Render:
      # sem isso o sistema sobe com e-mail e senha padrão, que são públicos
      # (estão no código) e qualquer um poderia usar para entrar.
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
